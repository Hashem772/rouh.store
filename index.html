<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روح | صفحة روابط المتجر</title>
  <meta name="description" content="صفحة روابط أنيقة لمتجر روح" />
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(13, 13, 13, 0.88);
      --panel-2: rgba(22, 22, 22, 0.88);
      --gold: #d8b15a;
      --gold-2: #f4d78f;
      --text: #f7f2e8;
      --muted: rgba(247, 242, 232, 0.78);
      --line: rgba(216, 177, 90, 0.45);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(216,177,90,0.16), transparent 18%),
        radial-gradient(circle at 85% 20%, rgba(216,177,90,0.08), transparent 20%),
        radial-gradient(circle at 50% 100%, rgba(216,177,90,0.10), transparent 20%),
        linear-gradient(180deg, #040404 0%, #0a0a0a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
    }

    body { overflow-x: hidden; }

    .glow-line {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.8;
    }

    .glow-line::before,
    .glow-line::after {
      content: "";
      position: absolute;
      width: 34vw;
      height: 34vw;
      border: 2px solid rgba(216, 177, 90, 0.52);
      border-radius: 50%;
      filter: drop-shadow(0 0 18px rgba(216,177,90,0.12));
    }

    .glow-line::before {
      top: -12vw;
      left: -12vw;
      transform: rotate(18deg);
      border-right-color: transparent;
      border-bottom-color: transparent;
    }

    .glow-line::after {
      right: -12vw;
      bottom: -12vw;
      transform: rotate(18deg);
      border-left-color: transparent;
      border-top-color: transparent;
    }

    .wrap {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 28px 16px 40px;
      position: relative;
      z-index: 1;
    }

    .card {
      position: relative;
      min-height: calc(100vh - 56px);
      border: 1.5px solid var(--line);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(18,18,18,0.94), rgba(8,8,8,0.96));
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow: hidden;
      padding: 28px 18px 22px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(216,177,90,0.25);
      border-radius: 26px;
      pointer-events: none;
    }

    .top-ornament {
      position: absolute;
      inset-inline: 0;
      top: 0;
      height: 160px;
      background: radial-gradient(circle at 50% 0%, rgba(244,215,143,0.18), transparent 40%);
      pointer-events: none;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .logo-circle {
      width: 172px;
      height: 172px;
      border-radius: 50%;
      border: 1.4px solid rgba(216,177,90,0.75);
      display: grid;
      place-items: center;
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(244,215,143,0.12), transparent 40%), rgba(0,0,0,0.1);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), inset 0 0 30px rgba(216,177,90,0.08);
    }

    .logo-circle::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(216,177,90,0.22);
    }

    .logo-text {
      font-size: 4.3rem;
      line-height: 1;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(216,177,90,0.25);
      font-weight: 700;
      letter-spacing: 0;
      transform: translateY(-4px);
    }

    .shop-name {
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      color: var(--gold);
      line-height: 1;
      margin: 0;
      font-weight: 800;
      text-shadow: 0 0 16px rgba(216,177,90,0.14);
    }

    .welcome {
      margin: 0;
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      color: var(--text);
      opacity: 0.95;
    }

    .divider {
      width: min(100%, 460px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(216,177,90,0.7), transparent);
      margin: 14px auto 18px;
      position: relative;
    }

    .divider::after {
      content: "✦";
      position: absolute;
      inset-inline-start: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      color: var(--gold);
      background: rgba(8,8,8,0.95);
      padding: 0 10px;
      font-size: 14px;
    }

    .links {
      display: grid;
      gap: 14px;
      width: min(100%, 520px);
      margin: 0 auto;
    }

    .link-btn {
      text-decoration: none;
      color: var(--text);
      display: grid;
      grid-template-columns: 62px 1fr 24px;
      align-items: center;
      gap: 12px;
      min-height: 78px;
      padding: 10px 14px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(22,22,22,0.95), rgba(12,12,12,0.95));
      border: 1px solid rgba(216,177,90,0.38);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 10px 25px rgba(0,0,0,0.25);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .link-btn:hover,
    .link-btn:active {
      transform: translateY(-2px);
      border-color: rgba(244,215,143,0.72);
      box-shadow: 0 14px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(244,215,143,0.08);
    }

    .icon-box {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 20%, rgba(244,215,143,0.38), rgba(216,177,90,0.14));
      border: 1px solid rgba(244,215,143,0.40);
      color: #111;
      font-size: 1.6rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: #111;
    }

    .link-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .link-sub {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.93rem;
      font-weight: 400;
    }

    .arrow {
      font-size: 1.5rem;
      color: var(--gold);
      opacity: 0.95;
      justify-self: end;
    }

    .footer-icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .mini-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(216,177,90,0.48);
      color: var(--gold);
      background: rgba(16,16,16,0.8);
    }

    .mini-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .copyright {
      text-align: center;
      color: rgba(247,242,232,0.7);
      font-size: 0.95rem;
      margin-top: 6px;
      padding-bottom: 4px;
    }

    .hint {
      text-align: center;
      color: rgba(247,242,232,0.55);
      font-size: 0.9rem;
      margin-top: 14px;
    }

    @media (max-width: 480px) {
      .wrap { padding: 12px 10px 20px; }
      .card { padding: 22px 12px 18px; border-radius: 28px; }
      .logo-circle { width: 150px; height: 150px; }
      .logo-text { font-size: 3.7rem; }
      .link-btn { grid-template-columns: 56px 1fr 20px; min-height: 72px; }
      .icon-box { width: 56px; height: 56px; }
      .link-title { font-size: 1.03rem; }
    }
  </style>
</head>
