    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر روح | في كل بيت روح</title>
    
    <!-- استيراد خطوط عربية فاخرة من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* إعدادات الخلفية الفاخرة */
        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            overflow: hidden;
        }

        /* الحاوية الرئيسية لتأثير التحميل الناعم */
        .container {
            text-align: center;
            animation: fadeIn 1.5s ease-out forwards;
            max-width: 450px;
            width: 100%;
        }

        /* تنسيق الشعار الاحترافي */
        .logo-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .logo-wrapper img {
            max-width: 280px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 4px 20px rgba(212, 175, 55, 0.15));
            transition: transform 0.4s ease;
        }

        /* تأثير تفاعلي خفيف عند لمس الشعار */
        .logo-wrapper img:hover {
            transform: scale(1.03);
        }

        /* تنسيق النص "في كل بيت روح" */
        .slogan {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 1px;
            margin: 0;
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 10px rgba(212, 175, 55, 0.1);
        }

        /* خط ديكوري صغير تحت النص */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 15px auto 0 auto;
            opacity: 0.7;
        }

        /* تأثيرات الحركة (Animation) */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* تحسينات الشاشات الصغيرة جداً */
        @media (max-width: 360px) {
            .logo-wrapper img {
                max-width: 220px;
            }
            .slogan {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تم تعديل اسم الصورة بدقة إلى الاسم الجديد logoo.png -->
        <div class="logo-wrapper">
            <img src="logoo.png" alt="شعار متجر روح">
        </div>
        
        <!-- النص التسويقي بالخط الذهبي الفاخر -->
        <h1 class="slogan">في كل بيت روح</h1>
        <div class="divider"></div>
    </div>

</body>
</html>
