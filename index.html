<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روح | روابطنا الرسمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-1: #040404;
      --bg-2: #0a0a0a;
      --panel: rgba(12, 12, 12, 0.76);
      --panel-strong: rgba(16, 16, 16, 0.94);
      --gold: #d9b25d;
      --gold-2: #f7d987;
      --gold-soft: rgba(217, 178, 93, 0.18);
      --text: #f6f1e6;
      --muted: rgba(246, 241, 230, 0.76);
      --line: rgba(217, 178, 93, 0.42);
      --shadow: rgba(0, 0, 0, 0.86);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 221, 141, 0.12), transparent 16%),
        radial-gradient(circle at 80% 12%, rgba(255, 221, 141, 0.10), transparent 18%),
        radial-gradient(circle at 50% 0%, rgba(255, 206, 100, 0.16), transparent 20%),
        linear-gradient(180deg, var(--bg-1) 0%, #090909 28%, #050505 100%);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.055) 0 1px, transparent 1.2px),
        radial-gradient(circle at 32% 10%, rgba(255,255,255,0.04) 0 1px, transparent 1.2px),
        radial-gradient(circle at 78% 20%, rgba(255,255,255,0.05) 0 1px, transparent 1.2px),
        radial-gradient(circle at 86% 75%, rgba(255,255,255,0.045) 0 1px, transparent 1.2px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.04) 0 1px, transparent 1.2px);
      background-size: 260px 260px;
      opacity: .55;
      animation: drift 18s linear infinite;
    }

    .page {
      width: min(440px, calc(100vw - 18px));
      min-height: calc(100vh - 18px);
      margin: 9px auto;
      position: relative;
      border-radius: 36px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 221, 141, 0.20), transparent 22%),
        linear-gradient(180deg, rgba(14,14,14,0.92), rgba(6,6,6,0.97));
      border: 1px solid rgba(217, 178, 93, 0.34);
      box-shadow:
        0 28px 90px rgba(0,0,0,0.82),
        inset 0 1px 0 rgba(255,255,255,0.03);
      animation: pageIn .8s cubic-bezier(.2,.9,.2,1) both;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(140deg, transparent 0%, rgba(255,255,255,0.03) 30%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(217,178,93,0.06), transparent 50%);
      pointer-events: none;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 28px;
      border: 1px solid rgba(217, 178, 93, 0.10);
      pointer-events: none;
    }

    .ornament {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .72;
    }

    .ornament .arc {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(217, 178, 93, 0.85);
      border-color: rgba(217, 178, 93, 0.85) transparent transparent rgba(217, 178, 93, 0.85);
      filter: drop-shadow(0 0 12px rgba(217, 178, 93, 0.18));
      animation: floaty 14s ease-in-out infinite;
    }

    .arc.a {
      width: 250px; height: 250px;
      left: -148px; top: -72px;
      transform: rotate(-18deg);
    }

    .arc.b {
      width: 270px; height: 270px;
      right: -154px; bottom: -112px;
      transform: rotate(153deg);
      animation-delay: -4s;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 22px 16px 16px;
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 4px auto 16px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(217, 178, 93, 0.30);
      background: rgba(255,255,255,0.02);
      color: rgba(247, 217, 135, 0.96);
      font-size: .86rem;
      font-weight: 700;
      letter-spacing: .2px;
      box-shadow: 0 10px 30px rgba(0,0,0,.24);
      animation: fadeUp .75s .1s ease both;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      text-align: center;
      margin-top: 2px;
    }

    .logo-ring {
      width: 202px;
      height: 202px;
      margin: 0 auto 14px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 228, 164, 0.18), transparent 58%),
        linear-gradient(180deg, rgba(21,21,21,0.98), rgba(8,8,8,0.98));
      border: 1.4px solid rgba(235, 198, 110, 0.95);
      box-shadow:
        0 0 0 1px rgba(235, 198, 110, 0.07),
        0 18px 34px rgba(0,0,0,0.58),
        inset 0 0 26px rgba(255, 222, 139, 0.06);
      animation: logoIn .9s cubic-bezier(.2,.85,.2,1) both;
    }

    .logo-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(235, 198, 110, 0.10);
    }

    .logo {
      width: 142px;
      height: 142px;
      object-fit: contain;
      display: block;
      filter:
        drop-shadow(0 2px 6px rgba(0,0,0,.45))
        drop-shadow(0 0 10px rgba(255, 221, 141, 0.10));
      transform: translateZ(0);
    }

    .title {
      margin: 2px 0 0;
      font-size: 2.18rem;
      line-height: 1;
      font-weight: 400;
      color: var(--gold-2);
      text-shadow: 0 2px 14px rgba(217, 178, 93, 0.22);
      letter-spacing: .2px;
      animation: fadeUp .8s .12s ease both;
    }

    .tagline {
      margin: 8px 0 0;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
      animation: fadeUp .8s .18s ease both;
    }

    .subline {
      margin: 4px 0 16px;
      font-size: 1rem;
      color: rgba(247, 217, 135, 0.98);
      font-weight: 700;
      letter-spacing: .2px;
      animation: fadeUp .8s .24s ease both;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 6px 0 12px;
      animation: fadeUp .8s .28s ease both;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 96px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(217,178,93,.92), transparent);
    }

    .divider i {
      color: var(--gold);
      font-size: 10px;
      transform: translateY(-1px);
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 12px;
      animation: fadeUp .9s .34s ease both;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 66px;
      padding: 0 18px 0 16px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      border: 1.2px solid rgba(217, 178, 93, 0.56);
      background:
        linear-gradient(180deg, rgba(26,26,26,0.96), rgba(10,10,10,0.98));
      box-shadow:
        0 10px 26px rgba(0,0,0,.48),
        inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow: hidden;
      transform: translateZ(0);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.04) 48%, transparent 58%);
      transform: translateX(-120%);
      transition: transform .85s ease;
      pointer-events: none;
    }

    .link:hover::before { transform: translateX(120%); }

    .link:hover {
      transform: translateY(-2px);
      border-color: rgba(247, 217, 135, 0.95);
      box-shadow:
        0 14px 34px rgba(0,0,0,.58),
        0 0 0 1px rgba(247, 217, 135, 0.10);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #111;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,244,203,.95), rgba(217,178,93,1) 56%, rgba(153,114,28,1) 100%);
      box-shadow:
        inset 0 1px 3px rgba(255,255,255,.36),
        0 0 0 1px rgba(255,235,180,.12);
      font-size: 19px;
      flex: 0 0 auto;
    }

    .arrow {
      color: var(--gold);
      font-size: 1rem;
      padding-inline-start: 6px;
      opacity: .96;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 10px;
      animation: fadeUp .9s .48s ease both;
    }

    .mini {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      border: 1px solid rgba(217, 178, 93, 0.65);
      background: rgba(12,12,12,0.58);
      box-shadow: 0 8px 20px rgba(0,0,0,.4);
      transition: transform .18s ease, border-color .18s ease;
    }

    .mini:hover {
      transform: translateY(-1px);
      border-color: rgba(247, 217, 135, 0.95);
    }

    .copyright {
      text-align: center;
      font-size: .86rem;
      color: rgba(246, 241, 230, 0.72);
      padding-bottom: 8px;
      animation: fadeUp .9s .56s ease both;
    }

    .copyright strong {
      color: var(--gold);
      font-weight: 700;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(2px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    @keyframes drift {
      0% { transform: translate3d(0,0,0); }
      50% { transform: translate3d(0,-8px,0); }
      100% { transform: translate3d(0,0,0); }
    }

    @media (max-width: 380px) {
      .page { width: calc(100vw - 10px); }
      .content { padding-inline: 12px; }
      .logo-ring { width: 180px; height: 180px; }
      .logo { width: 128px; height: 128px; }
      .title { font-size: 1.95rem; }
      .tagline, .subline { font-size: .96rem; }
      .link { height: 60px; }
      .left { font-size: .98rem; }
      .badge { width: 44px; height: 44px; font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
